name: Offline evidence audit
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python studies/laya-cn-a/audit.py
      - run: python -m unittest discover -s studies/laya-cn-a -p "test_*.py"
